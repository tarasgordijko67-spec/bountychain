<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SKYNULYS — Реєстрація</title>
    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="register">

<div class="auth-page">

    <div class="auth-box">

        <div class="auth-brand">
            <div class="logo">S</div>

            <div>
                <b>SKYNULYS</b>
                <small>GROUP PAYMENTS</small>
            </div>
        </div>

        <h1>Реєстрація</h1>

        <p class="auth-description">
            Створи акаунт та вибери свою роль.
        </p>

        <div id="registerMessage" class="hidden"></div>

        <form id="registerForm" class="auth-form">

            <label>
                Ім'я
                <input
                    id="registerName"
                    type="text"
                    placeholder="Олексій"
                    required
                >
            </label>

            <label>
                Email
                <input
                    id="registerEmail"
                    type="email"
                    placeholder="you@example.com"
                    required
                >
            </label>

            <label>
                Пароль
                <input
                    id="registerPassword"
                    type="password"
                    placeholder="Мінімум 6 символів"
                    minlength="6"
                    required
                >
            </label>

            <label>
                Повторіть пароль
                <input
                    id="registerPasswordConfirm"
                    type="password"
                    placeholder="Повторіть пароль"
                    minlength="6"
                    required
                >
            </label>

            <label>
                Роль
                <select id="registerRole" required>
                    <option value="participant">
                        Учасник
                    </option>

                    <option value="organizer">
                        Організатор
                    </option>
                </select>
            </label>

            <div class="auth-role-info">
                <b>Учасник</b> — перегляд кампаній
                та внесення грошей.

                <br><br>

                <b>Організатор</b> — створення
                та керування власними кампаніями.

                <br><br>

                <b>Адмін</b> — повний доступ.
            </div>

            <button class="btn" type="submit">
                Створити акаунт
            </button>

        </form>

        <div class="auth-footer">
            Вже є акаунт?
            <a href="login.html">Увійти</a>
        </div>

    </div>

</div>

<script src="js/app.js"></script>

</body>
</html>
