<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="css/styles.css">
</head>

<body data-page="campaigns">

<div class="layout">

    <aside class="sidebar">

        <div class="sidebar-logo">
            <div class="logo">S</div>
            <div>
                <b>SKYNULYS</b>
                <small>GROUP PAYMENTS</small>
            </div>
        </div>

        <nav class="menu">
            <a href="index.html">Головна</a>
